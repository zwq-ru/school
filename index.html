<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Школьный журнал</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root { --shadow: 0 1px 3px rgba(0,0,0,.08); --border-color: #b8b8b8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Golos Text', -apple-system, sans-serif; background:#f0f2f5; color:#1a1a1a; padding-bottom:40px; }

header { background:#fff; padding:12px 24px; display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 1px 4px rgba(0,0,0,.08); position:sticky; top:0; z-index:100; flex-wrap:wrap; gap:8px; }
.logo-area img { height:34px; width:auto; display:block; }

nav { display:flex; gap:4px; flex-wrap:wrap; }
nav button { border:none; background:transparent; padding:8px 14px; border-radius:8px; cursor:pointer;
  font-family:inherit; font-size:14px; color:#3c4043; }
nav button:hover { background:#f1f3f4; }
nav button.active { background:#e8f0fe; color:#0e69d5; font-weight:600; }

.user-box { display:flex; align-items:center; gap:10px; }
.user-box .avatar { width:32px; height:32px; border-radius:50%; background:#0e69d5; color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; }
.db-status { font-size:12px; padding:3px 10px; border-radius:12px; }
.db-ok { background:#e6f4ea; color:#137333; }
.db-bad { background:#fce8e6; color:#c5221f; }

main { max-width:1200px; margin:24px auto; padding:0 16px; }
.screen { display:none; }
.screen.active { display:block; }
h2 { font-size:20px; margin-bottom:16px; font-weight:600; }

.date-pill { text-align:center; margin:20px auto 10px; padding:5px 16px; background:#e9edf2; border-radius:20px;
  color:#5f6368; font-size:13px; font-weight:500; width:fit-content; }
.day-card { background:#fff; border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
.grade-row { display:flex; align-items:center; padding:14px 18px; gap:16px; }
.grade-row + .grade-row { border-top:1px solid #eef0f2; }
.grade-box { min-width:40px; height:40px; border-radius:10px; color:#1a1a1a; background:#eef1f5;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px;
  position:relative; flex-shrink:0; padding:0 6px; }
.g5 { background:#e6f4ea; color:#137333; }
.g4 { background:#e8f0fe; color:#1967d2; }
.g3 { background:#fef7e0; color:#b06000; }
.g2, .g1 { background:#fce8e6; color:#c5221f; }
.weight-badge { position:absolute; bottom:-6px; right:-6px; background:#0e69d5; color:#fff; font-size:10px;
  min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  padding:0 4px; font-weight:600; border:2px solid #fff; }
.grade-info { flex-grow:1; min-width:0; }
.subj { font-size:15px; font-weight:700; }
.wtype { font-size:13px; color:#6c737d; margin-top:3px; }
.arrow { color:#9aa0a6; font-size:20px; flex-shrink:0; }

.card { background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:18px; margin-bottom:12px; }
.empty { text-align:center; color:#9aa0a6; padding:40px 20px; font-size:14px; }

table.schedule { width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
.schedule td, .schedule th { padding:10px 12px; border-bottom:1px solid #eef0f2; font-size:14px; text-align:left; }
.schedule th { background:#f7f9fb; font-weight:600; }
.schedule .day { font-weight:700; color:#0e69d5; white-space:nowrap; }

.journal-controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px; }
.journal-controls select { padding:9px 12px; border:1px solid #dadce0; border-radius:10px; font-family:inherit; font-size:14px; background:#fff; }
.journal-wrap { overflow-x:auto; }

/* ===== ЖУРНАЛ: клетки 32x32, как в Excel ===== */
table.jgrid { border-collapse:collapse; background:#fff; box-shadow:var(--shadow); table-layout:fixed; }
.jgrid th, .jgrid td {
  border: 1px solid var(--border-color);
  text-align:center; vertical-align:middle;
  padding: 0; height: 32px;
}
.jgrid th { background:#f7f9fb; color:#3c4043; font-weight:600; font-size:11px; width:32px; }
.jgrid th.name-h { text-align:left; padding-left:10px; width:150px; min-width:150px; background:#fff; border-right:2px solid #8a8a8a; }
.jgrid td.name { background:#fff; font-weight:600; font-size:12px; padding-left:10px; text-align:left;
  white-space:nowrap; border-right:2px solid #8a8a8a; }
.jgrid td.avg { background:#f7f9fb; font-weight:700; color:#3c4043; font-size:12px;
  border-left:2px solid #8a8a8a; width:44px; min-width:44px; }
.jgrid td.mark-cell { cursor:pointer; position:relative; font-weight:700; font-size:14px; }
.jgrid td.mark-cell:hover, .jgrid td.empty-c:hover { outline:2px solid #0e69d5; outline-offset:-2px; }
.jgrid td.mark-5 { background:#e6f4ea; color:#137333; }
.jgrid td.mark-4 { background:#e8f0fe; color:#1967d2; }
.jgrid td.mark-3 { background:#fef7e0; color:#b06000; }
.jgrid td.mark-2, .jgrid td.mark-1 { background:#fce8e6; color:#c5221f; }
.jgrid td.empty-c { color:#dcdcdc; cursor:pointer; font-size:12px; }
.wbadge { position:absolute; top:0; right:0; background:#0e69d5; color:#fff; font-size:8px;
  min-width:13px; height:13px; border-radius:0 0 0 6px; display:flex; align-items:center; justify-content:center; }
.jgrid .cell-input { width:100%; height:100%; border:none; text-align:center; font-size:14px; font-weight:700;
  font-family:inherit; background:#fff; outline:none; padding:0; }
.jgrid .cell-input:focus { box-shadow: inset 0 0 0 2px #0e69d5; }
.journal-meta { font-size:12px; color:#6c737d; margin-top:10px; }

.hw-item { border-left:4px solid #0e69d5; }
.hw-item .meta { font-size:12px; color:#6c737d; margin-bottom:4px; }
.form-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.form-row input, .form-row select, .form-row button { padding:9px 12px; border:1px solid #dadce0; border-radius:10px; font-family:inherit; font-size:14px; }
.btn { background:#0e69d5; color:#fff; border:none !important; cursor:pointer; font-weight:600; }
.btn:hover { background:#0b5bbd; }
.btn-secondary { background:#e8f0fe; color:#0e69d5; cursor:pointer; font-weight:600; }

.login-wrap { max-width:380px; margin:60px auto; }
.login-wrap input { width:100%; padding:12px; margin-bottom:10px; border:1px solid #dadce0; border-radius:10px; font-family:inherit; font-size:15px; }
.login-wrap .btn { width:100%; padding:12px; font-size:15px; }
.login-hint { font-size:12px; color:#6c737d; text-align:center; margin-top:14px; line-height:1.6; }
.error-msg { background:#fce8e6; color:#c5221f; padding:10px 14px; border-radius:10px; font-size:13px; margin-bottom:12px; display:none; }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <img src="https://gu-st.ru/epgu-app-school-st/assets/svg/logo-big.svg" alt="" onerror="this.style.display='none'">
  </div>
  <nav id="nav"></nav>
  <div class="user-box" id="userBox"></div>
</header>

<main>
  <div class="screen" id="screen-login">
    <div class="login-wrap">
      <div class="card">
        <h2 style="text-align:center;">Вход в дневник</h2>
        <div class="error-msg" id="loginError"></div>
        <input id="loginUser" placeholder="Логин" autocomplete="username">
        <input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password">
        <button class="btn" onclick="doLogin()">Войти</button>
        <div class="login-hint">Ученики: student1 … student20 (пароль совпадает с логином)<br>Учитель: teacher / teacher</div>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-diary"><h2>Оценки</h2><div id="diaryList"></div></div>

  <div class="screen" id="screen-journal">
    <h2>Журнал</h2>
    <div class="journal-controls">
      <select id="jSubject" onchange="renderJournal()">
        <option>Русский язык</option><option>Математика</option><option>Литер. чтение</option>
        <option>Окруж. мир</option><option>ИЗО</option><option>Труд(технология)</option>
        <option>Физкультура</option><option>Англ. яз.</option><option>Музыка</option>
      </select>
      <select id="jType" onchange="renderJournal()">
        <option>Ответ на уроке</option><option>Контрольная работа</option><option>Самостоятельная работа</option>
        <option>Тест</option><option>Проект</option><option>Домашняя работа</option><option>Диктант</option>
      </select>
    </div>
    <div class="journal-wrap" id="journalTable"></div>
    <div class="journal-meta">Клик по клетке — поле ввода. Наберите оценку (2–5) и нажмите Enter. Пустое поле + Enter — удалить. Правый клик — вес оценки.</div>
  </div>

  <div class="screen" id="screen-schedule"><h2>Расписание</h2><div id="scheduleList"></div></div>

  <div class="screen" id="screen-homework">
    <h2>Задания</h2>
    <div id="hwTeacherForm" style="display:none;">
      <div class="card">
        <div class="form-row">
          <select id="hwSubject" style="flex:1;">
            <option>Русский язык</option><option>Математика</option><option>Литературное чтение</option>
            <option>Окружающий мир</option><option>Физкультура</option><option>Музыка</option>
          </select>
          <input id="hwText" placeholder="Текст задания" style="flex:2;">
          <input id="hwDue" type="date" style="flex:1;">
          <button class="btn" onclick="addHomework()">Добавить</button>
        </div>
      </div>
    </div>
    <div id="hwList"></div>
  </div>

  <div class="screen" id="screen-profile"><h2>Профиль</h2><div class="card" id="profileCard"></div></div>
</main>

<script>
// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyCw3RLQB_6HcOT8odym-CDGx4MQL5OT9Kw",
  authDomain: "school-f7fdd.firebaseapp.com",
  databaseURL: "https://school-f7fdd-default-rtdb.firebaseio.com",
  projectId: "school-f7fdd",
  storageBucket: "school-f7fdd.firebasestorage.app",
  messagingSenderId: "882294124527",
  appId: "1:882294124527:web:88f08a5d68f02e76e6901a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gradesRef = db.ref('grades');
const hwRef = db.ref('homework');

// ===== ПОЛЬЗОВАТЕЛИ =====
const STUDENT_NAMES = [
  'Антон Смирнов', 'Анна Козлова', 'Алексей Волков', 'Анастасия Морозова', 'Андрей Лебедев',
  'Борис Соколов', 'Виктория Панова', 'Владислав Ершов', 'Дарья Зайцева', 'Денис Крылов',
  'Екатерина Фомина', 'Егор Тарасов', 'Жанна Белова', 'Иван Гусев', 'Ксения Орлова',
  'Лев Шилов', 'Мария Рябова', 'Никита Дроздов', 'Ольга Никитина', 'Павел Клюев'
];
const USERS = {
  teacher: { pass:'teacher', role:'teacher', name:'Елена Ивановна', klass:'Учитель' }
};
STUDENT_NAMES.forEach(function(n, i){
  const login = 'student' + (i + 1);
  USERS[login] = { pass: login, role:'student', name: n, klass:'4 «А»' };
});

let currentUser = null;
let GRADES = [];
let HOMEWORK = [];

// ===== СИНХРОНИЗАЦИЯ =====
gradesRef.on('value', snap => {
  const val = snap.val() || {};
  GRADES = Object.keys(val).map(k => Object.assign({ id:k }, val[k]));
  renderAll();
}, err => setDbStatus(false, err));

hwRef.on('value', snap => {
  const val = snap.val() || {};
  HOMEWORK = Object.keys(val).map(k => Object.assign({ id:k }, val[k]));
  renderAll();
});

function setDbStatus(ok, err){
  const el = document.getElementById('dbStatus');
  if (!el) return;
  if (ok){ el.className='db-status db-ok'; el.textContent='База подключена'; }
  else { el.className='db-status db-bad'; el.textContent='Нет связи с базой'; console.error(err); }
}
db.ref('.info/connected').on('value', s => setDbStatus(!!s.val()));

// ===== ВХОД =====
function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  const acc = USERS[u];
  if (acc && acc.pass === p){
    currentUser = Object.assign({ login:u }, acc);
    sessionStorage.setItem('who', u);
    document.getElementById('loginError').style.display='none';
    buildUI();
  } else {
    const e = document.getElementById('loginError');
    e.textContent = 'Неверный логин или пароль';
    e.style.display='block';
  }
}
function logout(){ currentUser=null; sessionStorage.removeItem('who'); buildUI(); }
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ===== ИНТЕРФЕЙС =====
const TABS = [
  { id:'diary', label:'Дневник', roles:['student','teacher'] },
  { id:'journal', label:'Журнал', roles:['teacher'] },
  { id:'schedule', label:'Расписание', roles:['student','teacher'] },
  { id:'homework', label:'Задания', roles:['student','teacher'] },
  { id:'profile', label:'Профиль', roles:['student','teacher'] }
];
let activeTab = 'diary';

function buildUI(){
  const nav = document.getElementById('nav');
  const userBox = document.getElementById('userBox');
  if (!currentUser){
    nav.innerHTML=''; userBox.innerHTML='';
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('screen-login').classList.add('active');
    return;
  }
  userBox.innerHTML = '<span class="db-status db-ok" id="dbStatus">База подключена</span>' +
    '<div class="avatar">'+currentUser.name.charAt(0)+'</div>' +
    '<span style="font-size:14px;">'+currentUser.name+'</span>' +
    '<button class="btn-secondary" style="border:none;padding:7px 14px;border-radius:8px;" onclick="logout()">Выйти</button>';
  nav.innerHTML = TABS.filter(t=>t.roles.includes(currentUser.role))
    .map(t => '<button class="'+(t.id===activeTab?'active':'')+'" onclick="switchTab(\''+t.id+'\')">'+t.label+'</button>').join('');
  switchTab(activeTab);
}

function switchTab(id){
  activeTab = id;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>{
    const t = TABS.find(x=>x.id===id);
    b.classList.toggle('active', t && b.textContent.trim() === t.label);
  });
  renderAll();
}

// ===== ОБЩЕЕ =====
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function isoToLabel(iso){
  const d = new Date(iso);
  return d.getDate() + ' ' + MONTHS[d.getMonth()];
}
function gradeClass(v){ return 'g'+String(v).charAt(0); }
function toISO(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function renderAll(){
  renderDiary(); renderJournal(); renderSchedule(); renderHomework(); renderProfile();
}

// ===== ДНЕВНИК =====
function renderDiary(){
  const box = document.getElementById('diaryList');
  if (!currentUser) return;
  const login = currentUser.role==='student' ? currentUser.login : null;
  const list = GRADES.filter(g => !login || g.student === login);
  const groups = {};
  list.forEach(g => { const d = g.date || '—'; if (!groups[d]) groups[d] = []; groups[d].push(g); });
  const dates = Object.keys(groups).sort((a,b) => new Date(b) - new Date(a));
  if (!dates.length){ box.innerHTML = '<div class="empty">Оценок пока нет</div>'; return; }
  box.innerHTML = dates.map(d =>
    '<div class="date-pill">'+isoToLabel(d)+'</div>' +
    '<div class="day-card">' + groups[d].map(g =>
      '<div class="grade-row">' +
        '<div class="grade-box '+gradeClass(g.value)+'">'+g.value +
          (g.weight>1 ? '<span class="weight-badge">'+g.weight+'</span>' : '') +
        '</div>' +
        '<div class="grade-info"><div class="subj">'+g.subject+'</div>' +
        '<div class="wtype">'+(g.typeWork||'Ответ на уроке')+'</div></div>' +
        '<div class="arrow">›</div>' +
      '</div>').join('') +
    '</div>').join('');
}

// ===== ЖУРНАЛ =====
const DAYS = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function lastWeekdays(n){
  const days = [];
  let d = new Date();
  while (days.length < n){
    if (d.getDay() !== 0 && d.getDay() !== 6) days.push(new Date(d));
    d.setDate(d.getDate()-1);
  }
  return days.reverse();
}

function renderJournal(){
  if (!currentUser || currentUser.role!=='teacher') return;
  const dates = lastWeekdays(8);
  const isos = dates.map(toISO);
  const subj = document.getElementById('jSubject').value;

  let html = '<table class="jgrid"><tr><th class="name-h">Ученик</th>';
  dates.forEach(d => html += '<th>'+DAYS[d.getDay()]+'<br>'+d.getDate()+'</th>');
  html += '<th class="avg">Ср.</th></tr>';

  Object.keys(USERS).filter(u=>u.startsWith('student')).forEach(stu => {
    html += '<tr><td class="name">'+USERS[stu].name+'</td>';
    isos.forEach(iso => {
      const g = GRADES.find(x => x.student===stu && x.subject===subj && x.date===iso);
      const cellId = 'c_'+stu+'_'+iso;
      if (g){
        html += '<td class="mark-cell mark-'+String(g.value).charAt(0)+'" id="'+cellId+'" ' +
          'onclick="editCell(\''+stu+'\',\''+iso+'\',\''+g.id+'\')" ' +
          'oncontextmenu="setWeight(event,\''+g.id+'\');return false;">'+g.value+
          (g.weight>1?'<span class="wbadge">'+g.weight+'</span>':'')+'</td>';
      } else {
        html += '<td class="empty-c" id="'+cellId+'" ' +
          'onclick="editCell(\''+stu+'\',\''+iso+'\',null)">·</td>';
      }
    });
    const list = GRADES.filter(x => x.student===stu && x.subject===subj && isos.indexOf(x.date) > -1);
    let sum=0, w=0;
    list.forEach(g => { const v = parseFloat(g.value); if (!isNaN(v)) { sum += v*(g.weight||1); w += (g.weight||1); } });
    html += '<td class="avg">'+(w ? (sum/w).toFixed(1) : '—')+'</td></tr>';
  });
  html += '</table>';
  document.getElementById('journalTable').innerHTML = html;
}

// Ввод оценки: клик по клетке -> поле ввода на всю клетку -> Enter
function editCell(student, iso, gradeId){
  const cell = document.getElementById('c_'+student+'_'+iso);
  if (!cell) return;
  const existing = gradeId ? GRADES.find(g=>g.id===gradeId) : null;
  cell.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.maxLength = 2;
  input.className = 'cell-input';
  input.inputMode = 'numeric';
  input.value = existing ? existing.value : '';
  cell.appendChild(input);
  input.focus();
  input.select();
  let finished = false;
  function commit(save){
    if (finished) return;
    finished = true;
    const v = input.value.trim();
    if (save){
      const subj = document.getElementById('jSubject').value;
      const type = document.getElementById('jType').value;
      if (v === ''){
        if (gradeId) gradesRef.child(gradeId).remove();
      } else if (gradeId){
        gradesRef.child(gradeId).update({ value: v, typeWork: type });
      } else {
        gradesRef.push({
          student: student,
          subject: subj,
          value: v,
          weight: 1,
          typeWork: type,
          date: iso
        });
      }
    }
    renderJournal();
  }
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit(true);
    else if (e.key === 'Escape') commit(false);
    else if (e.key === 'Tab') { e.preventDefault(); commit(true); }
  });
  input.addEventListener('blur', () => commit(false));
}

function setWeight(e, id){
  e.preventDefault();
  const g = GRADES.find(x=>x.id===id);
  if (!g) return;
  const w = prompt('Вес оценки (1–5):', g.weight || 1);
  if (w !== null){
    const n = Math.min(5, Math.max(1, parseInt(w)||1));
    gradesRef.child(id).update({ weight:n });
  }
}

// ===== РАСПИСАНИЕ =====
const SCHEDULE = {
  'Понедельник': ['Русский язык','Математика','Литературное чтение','Физкультура'],
  'Вторник': ['Математика','Окружающий мир','Русский язык','Музыка'],
  'Среда': ['Литературное чтение','Русский язык','Изобразительное искусство','Технология'],
  'Четверг': ['Математика','Английский язык','Окружающий мир','Физкультура'],
  'Пятница': ['Русский язык','Математика','Литературное чтение','Музыка']
};
function renderSchedule(){
  document.getElementById('scheduleList').innerHTML = Object.keys(SCHEDULE).map(day =>
    '<table class="schedule" style="margin-bottom:12px;"><tr><th class="day" colspan="2">'+day+'</th></tr>' +
    SCHEDULE[day].map((s,i)=>'<tr><td style="width:40px;color:#6c737d;">'+(i+1)+'</td><td>'+s+'</td></tr>').join('') +
    '</table>').join('');
}

// ===== ЗАДАНИЯ =====
function renderHomework(){
  document.getElementById('hwTeacherForm').style.display = currentUser && currentUser.role==='teacher' ? 'block':'none';
  const list = HOMEWORK.slice().sort((a,b)=> new Date(a.due||0) - new Date(b.due||0));
  document.getElementById('hwList').innerHTML = list.length ? list.map(h =>
    '<div class="card hw-item"><div class="meta">'+h.subject+(h.due?' · до '+isoToLabel(h.due):'')+'</div>'+h.text+'</div>').join('')
    : '<div class="empty">Заданий нет</div>';
}
function addHomework(){
  const text = document.getElementById('hwText').value.trim();
  const subj = document.getElementById('hwSubject').value;
  const due = document.getElementById('hwDue').value;
  if (!text) return;
  hwRef.push({ subject:subj, text:text, due:due||null });
  document.getElementById('hwText').value='';
}

// ===== ПРОФИЛЬ =====
function renderProfile(){
  if (!currentUser) return;
  document.getElementById('profileCard').innerHTML =
    '<div style="display:flex;align-items:center;gap:16px;">' +
    '<div class="avatar" style="width:64px;height:64px;font-size:26px;">'+currentUser.name.charAt(0)+'</div>' +
    '<div><div style="font-size:18px;font-weight:700;">'+currentUser.name+'</div>' +
    '<div style="color:#6c737d;font-size:14px;margin-top:4px;">'+currentUser.klass+'</div></div></div>';
}

// ===== СТАРТ =====
buildUI();
</script>
