<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Школьный журнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Golos Text', 'Segoe UI', sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 16px;
        color: #1c1e21;
    }
    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
    }
    .topbar h1 { font-size: 22px; margin: 0; font-weight: 700; }
    .status {
        font-size: 13px;
        padding: 5px 12px;
        border-radius: 20px;
        background: #ffebee;
        color: #c62828;
        white-space: nowrap;
    }
    .status.ok { background: #e8f5e9; color: #2e7d32; }
    .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
    }
    select, .mode-btn {
        font-family: inherit;
        font-size: 14px;
        padding: 9px 12px;
        border: 1px solid #d0d4dc;
        border-radius: 10px;
        background: #fff;
        color: #1c1e21;
        outline: none;
    }
    .mode-btn.active {
        background: #3369e7;
        color: #fff;
        border-color: #3369e7;
    }
    .hint {
        font-size: 13px;
        color: #65676b;
        margin-bottom: 12px;
    }
    .table-wrap {
        overflow-x: auto;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
    }
    th, td {
        border-bottom: 1px solid #eceef1;
        padding: 10px 8px;
        text-align: center;
        font-size: 14px;
    }
    th {
        background: #f7f8fa;
        font-weight: 600;
        position: sticky;
        top: 0;
    }
    td.name { text-align: left; font-weight: 600; white-space: nowrap; padding-left: 12px; }
    td.num { color: #8a8d91; width: 40px; }
    .grade-cell {
        cursor: pointer;
        font-weight: 700;
        font-size: 16px;
        width: 56px;
        border-radius: 6px;
        transition: background .15s;
    }
    .grade-cell:hover { background: #e8f0fe; }
    .g5 { color: #1b8a3f; }
    .g4 { color: #3369e7; }
    .g3 { color: #c77700; }
    .g2 { color: #d93025; }
    .g-na { color: #c3c6cb; font-weight: 400; }
    td.avg { font-weight: 600; color: #444; }
    input.grade-input {
        width: 48px;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        text-align: center;
        border: 2px solid #3369e7;
        border-radius: 6px;
        outline: none;
        padding: 4px 0;
    }
    .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(80px);
        background: #202124;
        color: #fff;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 14px;
        box-shadow: 0 4px 14px rgba(0,0,0,.3);
        opacity: 0;
        transition: all .3s ease;
        z-index: 100;
        pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
    <h1>Журнал 9Б</h1>
    <div class="status" id="status">Подключение...</div>
</div>

<div class="controls">
    <select id="subjectSel"></select>
    <button class="mode-btn active" id="btnTeacher" onclick="setMode('teacher')">Учитель</button>
    <button class="mode-btn" id="btnStudent" onclick="setMode('student')">Ученик</button>
</div>

<div class="hint" id="hint"></div>

<div class="table-wrap">
    <table id="journalTable">
        <thead>
            <tr>
                <th>№</th>
                <th style="text-align:left; padding-left:12px;">Ученик</th>
                <!-- колонки дней добавит JS -->
                <th>Ср. балл</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== FIREBASE (твой конфиг) =====
const firebaseConfig = {
    apiKey: "AIzaSyCw3RLQB_6HcOT8odym-CDGx4MQL5OT9Kw",
    authDomain: "school-f7fdd.firebaseapp.com",
    databaseURL: "https://school-f7fdd-default-rtdb.firebaseio.com",
    projectId: "school-f7fdd",
    storageBucket: "school-f7fdd.firebasestorage.app",
    messagingSenderId: "882294124527",
    appId: "1:882294124527:web:88f08a5d68f02e76e6901a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== СПИСОК УЧЕНИКОВ (добавляй новых строками ниже) =====
const students = [
    { id: 1,  name: "Иванов Иван" },
    { id: 2,  name: "Петрова Анна" },
    { id: 3,  name: "Сидоров Алексей" },
    { id: 4,  name: "Кузнецова Мария" },
    { id: 5,  name: "Смирнов Дмитрий" },
    { id: 6,  name: "Васильева Елена" },
    { id: 7,  name: "Михайлов Сергей" },
    { id: 8,  name: "Новикова Ольга" },
    { id: 9,  name: "Фёдоров Андрей" },
    { id: 10, name: "Морозова Ирина" },
    { id: 11, name: "Волков Павел" },
    { id: 12, name: "Алексеева Татьяна" },
    { id: 13, name: "Лебедев Константин" },
    { id: 14, name: "Козлова Юлия" },
    { id: 15, name: "Новиков Роман" },
    { id: 16, name: "Орлова Дарья" },
    { id: 17, name: "Киселёв Максим" },
    { id: 18, name: "Соколова Полина" },
    { id: 19, name: "Тарасов Егор" },
    { id: 20, name: "Белова София" }
];

// ===== ПРЕДМЕТЫ (добавляй: "hist": "История" и т.д.) =====
const subjectNames = {
    "math": "Математика",
    "rus":  "Русский язык",
    "phys": "Физика",
    "eng":  "Английский язык",
    "hist": "История"
};

// ===== СОСТОЯНИЕ =====
let mode = localStorage.getItem('jm_mode') || 'teacher';
let subject = localStorage.getItem('jm_subject') || Object.keys(subjectNames)[0];
let grades = {};            // grades[subject][studentId][dateKey] = {v, w}
let editingCell = null;

// ===== ПОСЛЕДНИЕ 8 УЧЕБНЫХ ДНЕЙ (пн-сб, без вс) =====
function getDays() {
    const days = [];
    const d = new Date();
    while (days.length < 8) {
        const dow = d.getDay();
        if (dow !== 0) {
            const key = d.toISOString().slice(0, 10);
            const label = d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
            days.unshift({ key, label });
        }
        d.setDate(d.getDate() - 1);
    }
    return days;
}
const days = getDays();

// ===== ИНТЕРФЕЙС =====
const subjectSel = document.getElementById('subjectSel');
Object.entries(subjectNames).forEach(([k, v]) => {
    const o = document.createElement('option');
    o.value = k; o.textContent = v;
    if (k === subject) o.selected = true;
    subjectSel.appendChild(o);
});
subjectSel.onchange = () => {
    subject = subjectSel.value;
    localStorage.setItem('jm_subject', subject);
    render();
};

function setMode(m) {
    mode = m;
    localStorage.setItem('jm_mode', m);
    document.getElementById('btnTeacher').classList.toggle('active', m === 'teacher');
    document.getElementById('btnStudent').classList.toggle('active', m === 'student');
    document.getElementById('hint').textContent = m === 'teacher'
        ? 'Кликни по ячейке, введи оценку и нажми Enter. Правый клик — вес оценки.'
        : 'Режим ученика: только просмотр оценок.';
    if (editingCell) cancelEdit();
}
setMode(mode);

function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== ОТРИСОВКА =====
function render() {
    const tbody = document.getElementById('tableBody');
    const head = document.querySelector('#journalTable thead tr');
    // шапка
    head.innerHTML = '<th>№</th><th style="text-align:left; padding-left:12px;">Ученик</th>'
        + days.map(d => `<th>${d.label}</th>`).join('')
        + '<th>Ср. балл</th>';
    // строки
    tbody.innerHTML = '';
    students.forEach((s, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="num">${i + 1}</td><td class="name">${s.name}</td>`;
        days.forEach(d => {
            const td = document.createElement('td');
            td.className = 'grade-cell';
            const g = (grades[subject] || {})[s.id] || {};
            const rec = g[d.key];
            if (rec) {
                td.textContent = rec.v;
                td.classList.add('g' + rec.v);
            } else {
                td.textContent = mode === 'teacher' ? '+' : '·';
                td.classList.add('g-na');
            }
            td.dataset.sid = s.id;
            td.dataset.day = d.key;
            td.onclick = () => startEdit(td);
            td.oncontextmenu = (e) => { e.preventDefault(); setWeight(td); };
            tr.appendChild(td);
        });
        const avg = calcAvg(s.id);
        const tdAvg = document.createElement('td');
        tdAvg.className = 'avg';
        tdAvg.textContent = avg > 0 ? avg.toFixed(2) : '—';
        tr.appendChild(tdAvg);
        tbody.appendChild(tr);
    });
}

function calcAvg(sid) {
    const g = (grades[subject] || {})[sid] || {};
    let sum = 0, n = 0;
    Object.values(g).forEach(r => { sum += r.v * (r.w || 1); n += (r.w || 1); });
    return n ? sum / n : 0;
}

// ===== ВВОД ОЦЕНКИ =====
function startEdit(td) {
    if (mode !== 'teacher') { showToast('Только учитель может ставить оценки'); return; }
    if (editingCell) cancelEdit();
    editingCell = td;
    const input = document.createElement('input');
    input.className = 'grade-input';
    input.inputMode = 'numeric';
    input.maxLength = 1;
    input.value = td.classList.contains('g-na') ? '' : td.textContent;
    td.textContent = '';
    td.appendChild(input);
    input.focus();
    input.onkeydown = (e) => {
        if (e.key === 'Enter') saveEdit(td, input.value);
        if (e.key === 'Escape') cancelEdit();
    };
    input.onblur = () => setTimeout(() => { if (editingCell === td) cancelEdit(); }, 150);
}

function cancelEdit() {
    if (!editingCell) return;
    const td = editingCell;
    editingCell = null;
    render();
}

function saveEdit(td, val) {
    const sid = Number(td.dataset.sid);
    const day = td.dataset.day;
    editingCell = null;
    if (!['2','3','4','5'].includes(val)) { cancelEdit(); return; }
    db.ref(`grades/${subject}/${sid}/${day}`).set({ v: Number(val), w: 1 })
        .catch(err => showToast('Ошибка: ' + err.message));
}

// правый клик — вес оценки (1..3)
function setWeight(td) {
    if (mode !== 'teacher') return;
    const sid = Number(td.dataset.sid);
    const day = td.dataset.day;
    const rec = ((grades[subject] || {})[sid] || {})[day];
    if (!rec) { showToast('Сначала поставь оценку'); return; }
    const w = ((rec.w || 1) % 3) + 1;
    db.ref(`grades/${subject}/${sid}/${day}`).update({ w })
        .then(() => showToast(`Вес оценки: ${w} (нажми ещё раз ПКМ для смены)`))
        .catch(err => showToast('Ошибка: ' + err.message));
}

// ===== РЕАЛЬНОЕ ВРЕМЯ =====
db.ref('grades').on('value', snap => {
    grades = snap.val() || {};
    if (!editingCell) render();
});

const st = document.getElementById('status');
db.ref('.info/connected').on('value', s => {
    st.textContent = s.val() ? 'База подключена' : 'Нет связи с базой';
    st.classList.toggle('ok', !!s.val());
});

render();
</script>
</body>
</html>
